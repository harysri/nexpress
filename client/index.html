<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/nespressfavicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#020617" />
    <script>
      // Apply the saved theme before the first paint to avoid a flash.
      (function () {
        try {
          var saved = localStorage.getItem("nexpress-theme");
          var dark = saved !== "light";
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#020617" : "#f8fafc");
        } catch (error) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>

    <title>NexPress — Free Private PDF & OCR Toolkit</title>
    <meta
      name="description"
      content="Compress, merge, split, organize, protect, watermark and sign PDFs, convert PDFs to images or images to PDF, and run OCR — entirely in your browser. No uploads."
    />
    <meta name="robots" content="index,follow" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NexPress" />
    <meta property="og:title" content="NexPress — Free Private PDF & OCR Toolkit" />
    <meta
      property="og:description"
      content="Eleven PDF and OCR tools that run locally in your browser. Your files never leave your device."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NexPress — Free Private PDF & OCR Toolkit" />
    <meta
      name="twitter:description"
      content="Eleven PDF and OCR tools that run locally in your browser. Your files never leave your device."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
